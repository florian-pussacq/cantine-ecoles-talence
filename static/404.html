<!doctype html>
<!--
  Page servie par Netlify pour toute adresse inconnue.

  Elle ne passe pas par SvelteKit : l'adapter est en `fallback: undefined`, donc
  une URL qui ne correspond à aucune route prérendue n'atteint jamais
  l'application. C'est le seul fichier du projet qui ne peut pas lire
  `tokens.css`, et une page d'erreur qui dépendrait du chargement de
  l'application serait une page d'erreur qui échoue.

  Elle recopie donc les jetons qu'elle emploie, sous leur nom et avec leur
  valeur, en clair et en sombre. `contrast.test.ts` refuse une copie qui
  diverge de `tokens.css` (finition-week-end-et-404, D3).

  Pour la même raison, le lien de retour est le seul chemin absolu écrit à la
  main du dépôt : `$app/paths` n'est pas atteignable ici, et le site est servi à
  la racine du domaine (design.md, D2).
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Page introuvable — menus des écoles de Talence</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light dark;
        --fond: #f2f3f0;
        --carte: #ffffff;
        --bord: #daddd6;
        --encre: #131614;
        --encre-douce: #545a55;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fond: #111412;
          --carte: #1a1e1b;
          --bord: #2a302c;
          --encre: #edefea;
          --encre-douce: #9aa29c;
        }
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: var(--fond);
        color: var(--encre);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main {
        max-width: 30rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 1.875rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        text-wrap: balance;
      }

      /* Le code d'erreur suit le titre au lieu de le surmonter : un surtitre
         est une ligne de plus à lire avant ce qui compte
         (refonte-signaletique). */
      p {
        margin: 0.5rem 0 1rem;
        color: var(--encre-douce);
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        /* Cible tactile minimale (WCAG 2.1 AA), comme dans l'application. */
        min-height: 44px;
        padding-inline: 1rem;
        margin-top: 0.5rem;
        border-radius: 8px;
        background: var(--carte);
        border: 1px solid var(--bord);
        color: var(--encre);
        font-weight: 600;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid var(--encre);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cette page n'existe pas.</h1>
      <p>Erreur 404</p>
      <a href="/">Voir le menu du jour</a>
    </main>
  </body>
</html>
