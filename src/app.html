<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      L'application a une apparence, et une seule (design.md, D25). Il n'y a donc
      ni requête de média sur la teinte, ni script à exécuter avant la première
      peinture : le HTML prérendu arrive déjà juste.
    -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#2b3440" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
