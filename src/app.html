<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Le seul script exécuté avant la première peinture (jour-au-premier-rendu,
      D1). La page porte le jour de Paris pour lequel elle a été rendue ; le
      service worker peut la servir des semaines plus tard. Si ce jour n'est pas
      celui du navigateur, la page est marquée périmée, et la zone qui dépend du
      jour reste masquée jusqu'à l'hydratation (tokens.css). D32 avait refusé un
      tel script pour un défaut inoffensif ; un menu faux sous « Aujourd'hui »
      ne l'est pas.
    -->
    <script>
      (function (racine) {
        var rendu = racine.getAttribute('data-jour-rendu');
        var jour = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Paris' }).format(
          new Date()
        );
        if (rendu && rendu !== jour) racine.setAttribute('data-perime', '');
      })(document.documentElement);
    </script>
    <!--
      L'apparence suit le système, claire ou sombre, sans script de thème
      (mode-sombre, D1, D5). `color-scheme` le dit au navigateur avant la feuille
      de style, pour que le canevas de la première peinture ne soit pas blanc
      chez qui est en sombre ; la barre du navigateur prend le fond de chaque
      palette. Ces deux couleurs recopient `--fond` : une balise ne lit pas les
      jetons.
    -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!--
      La bibliothèque de formes, posée ici par le hook serveur
      `src/hooks.server.ts` au moment du pré-rendu (design.md, D57).

      Elle est ici, et non dans un composant, parce qu'elle n'a ni état ni
      réactivité : la faire traverser Svelte la ferait payer une seconde fois
      dans le bundle JavaScript. Elle est posée hors du conteneur de
      l'application pour la même raison — l'hydratation n'a rien à y faire.

      Attention en modifiant ce commentaire : les jetons de substitution de
      SvelteKit sont remplacés partout dans ce fichier, y compris à l'intérieur
      d'un commentaire. En nommer un ici injecterait le corps de l'application
      au milieu de cette phrase, et le document ne s'en relèverait pas.
    -->
    <!--sprite-->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
