# Vérification à chaque poussée.
#
# La publication n'est pas faite ici : Netlify est branché sur ce dépôt et
# rejoue `npm run validate && npm run build` de son côté. Ce pipeline existe
# pour que les branches et les merge requests soient vérifiées avant d'y
# arriver, et parce qu'il porte les tests de bout en bout que l'image de
# construction de Netlify ne peut pas exécuter.
#
# Conséquence à connaître : un job `e2e` rouge n'empêche pas Netlify de publier.
# C'est le prix de l'intégration Git native, qui est ce qui donne les
# prévisualisations de merge request.

default:
  # Même version que `.nvmrc` et que Netlify, qui lit ce même fichier.
  image: node:24.3.0
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]
  before_script:
    - npm ci --cache .npm --prefer-offline

# Sans cette règle, une merge request ouverte déclenche deux pipelines pour le
# même commit : celui de la branche et celui de la merge request.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages: [verifier]

verifier:
  stage: verifier
  script:
    # Formatage, lint, dérive des types, validité des données, types Svelte,
    # tests unitaires — en une commande, la même qu'en local.
    - npm run validate
    # La construction applique les budgets de performance et échoue s'ils sont
    # dépassés.
    - npm run build

e2e:
  stage: verifier
  # Les navigateurs sont installés à la demande plutôt que par une image
  # `mcr.microsoft.com/playwright`, dont l'étiquette doit suivre la version de
  # `@playwright/test` à chaque montée. Une minute d'installation contre une
  # source de désynchronisation silencieuse : le choix est vite fait.
  script:
    - npx playwright install --with-deps chromium
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths: [playwright-report/]
    expire_in: 1 week
