name: Vérifier et publier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Une seule publication à la fois ; une nouvelle annule celle en cours plutôt que
# de risquer deux déploiements concurrents sur le même site.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Formatage, lint, dérive des types, validité des données, types Svelte,
      # tests unitaires — en une commande, la même qu'en local.
      - run: npm run validate

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Le build applique les budgets de performance et échoue s'ils sont
      # dépassés. Il tourne ici avec le préfixe de déploiement réel, pour que le
      # sous-chemin ne casse pas en production alors que tout marche en local.
      - name: Construire avec le préfixe de déploiement
        env:
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: build

  publier:
    name: Publier
    if: github.ref == 'refs/heads/main'
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4

      # Un déploiement vert ne prouve pas que le site est servi. Ce contrôle
      # vérifie ce dont l'application a réellement besoin : le manifeste des
      # menus, à l'adresse où elle ira le chercher.
      - name: Contrôler que les menus sont servis
        run: |
          set -euo pipefail
          url="${{ steps.deploiement.outputs.page_url }}data/index.json"
          echo "Contrôle de $url"
          for tentative in 1 2 3 4 5; do
            if corps=$(curl -fsS --max-time 20 "$url"); then
              echo "$corps" | node -e '
                const donnees = JSON.parse(require("fs").readFileSync(0, "utf8"));
                if (donnees.schemaVersion !== 1) throw new Error("schemaVersion inattendu");
                if (!Array.isArray(donnees.months) || donnees.months.length === 0) {
                  throw new Error("manifeste sans aucun mois");
                }
                console.log(`Manifeste servi : ${donnees.months.length} mois.`);
              '
              exit 0
            fi
            echo "Pas encore disponible, nouvelle tentative dans 10 s ($tentative/5)"
            sleep 10
          done
          echo "Le manifeste n'est pas servi après le déploiement." >&2
          exit 1
