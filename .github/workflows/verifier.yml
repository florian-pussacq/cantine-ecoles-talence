# Vérification de chaque poussée sur `main`, et des pull requests s'il y en a.
#
# Elle ne publie pas. Netlify ne publie plus à la poussée : `netlify.toml` annule
# ces constructions. La publication est un geste humain, le workflow `publier`,
# qui n'appelle le build hook que si `verifier` et `e2e` ont réussi sur la tête
# de `main` (deploiement-manuel ; `docs/livraison.md`). Netlify rejoue
# `npm run validate && npm run build` de son côté, mais n'exécute pas les tests
# de bout en bout : ils vivent ici.
#
# Le job `extraction` rejoue l'extracteur des menus sur chaque PDF conservé. Il ne
# garde pas la production (extraction-reproductible, D5).

name: verifier

# On pousse sur `main` ; une pull request reste vérifiée si l'on en ouvre une (D2).
on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle poussée sur la même référence rend l'exécution en cours sans objet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # La version de Node vient de `.nvmrc`, que Netlify lit aussi : une seule
      # déclaration pour l'hébergeur, l'intégration continue et le poste (D3).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Formatage, lint, dérive des types, validité des données, types Svelte,
      # tests unitaires — en une commande, la même qu'en local.
      - run: npm run validate
      # La construction applique les budgets de performance et échoue s'ils sont
      # dépassés.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium installé à la demande plutôt que par une image
      # `mcr.microsoft.com/playwright`, dont l'étiquette devrait suivre la version
      # de `@playwright/test` à chaque montée (D4).
      - run: npx playwright install --with-deps chromium
      # `CI` est posé par GitHub : Playwright construit alors son propre serveur,
      # avec l'instant fixé au pré-rendu, au lieu d'en réutiliser un (D6).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # L'extracteur des menus reproduit-il encore chaque mois publié depuis son PDF ?
  # La publication ne l'attend pas : l'application sert des données déjà commitées,
  # qu'un extracteur cassé ne touche pas. Le job rouge dit qu'on ne peut plus en
  # produire de nouvelles (extraction-reproductible, D5).
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      # La version de PyMuPDF est celle que déclare le dépôt, épinglée (D1).
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/test_extraction.py
