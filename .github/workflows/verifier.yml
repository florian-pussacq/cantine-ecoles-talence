# Vérification de chaque poussée sur `main`, et des pull requests s'il y en a ;
# publication de `main` une fois vérifiée.
#
# Netlify ne publie plus à la poussée : `netlify.toml` annule ces constructions.
# Le job `publier` appelle le build hook quand `verifier` et `e2e` ont réussi :
# c'est la seule voie vers la production (barriere-de-deploiement ;
# `docs/livraison.md`). Netlify rejoue `npm run validate && npm run build` de son
# côté, mais n'exécute pas les tests de bout en bout : ils vivent ici.

name: verifier

# On pousse sur `main` ; une pull request reste vérifiée si l'on en ouvre une (D2).
on:
  pull_request:
  push:
    branches: [main]

# Une nouvelle poussée sur la même référence rend l'exécution en cours sans objet.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # La version de Node vient de `.nvmrc`, que Netlify lit aussi : une seule
      # déclaration pour l'hébergeur, l'intégration continue et le poste (D3).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Formatage, lint, dérive des types, validité des données, types Svelte,
      # tests unitaires — en une commande, la même qu'en local.
      - run: npm run validate
      # La construction applique les budgets de performance et échoue s'ils sont
      # dépassés.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chromium installé à la demande plutôt que par une image
      # `mcr.microsoft.com/playwright`, dont l'étiquette devrait suivre la version
      # de `@playwright/test` à chaque montée (D4).
      - run: npx playwright install --with-deps chromium
      # `CI` est posé par GitHub : Playwright construit alors son propre serveur,
      # avec l'instant fixé au pré-rendu, au lieu d'en réutiliser un (D6).
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publier:
    # Seulement pour une poussée sur `main` : une pull request ne publie rien.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verifier, e2e]
    runs-on: ubuntu-latest
    steps:
      # Sans le secret, la production cesserait de se mettre à jour sans que
      # personne le sache : l'échec doit se voir (D3).
      - name: Vérifier la présence du build hook
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::Secret NETLIFY_BUILD_HOOK absent : rien ne peut être publié."
            exit 1
          fi
      # Un hook construit la tête de `main` au moment de l'appel, pas ce commit-ci.
      # Si une poussée l'a dépassé, c'est son propre passage qui publiera (D2).
      - name: Publier si ce commit est encore la tête de main
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
          SHA: ${{ github.sha }}
          # Le jeton du workflow, en lecture seule : il suffit pour lire la tête de
          # `main`, dépôt privé compris.
          GH_TOKEN: ${{ github.token }}
        run: |
          tete=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$tete" != "$SHA" ]; then
            echo "main est passée à $tete : ce passage ne publie pas."
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$HOOK"
          echo "Publication demandée pour $SHA."
